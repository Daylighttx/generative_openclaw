name: Build Release

on:
  push:
    branches: [main, master]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create release package
        run: |
          mkdir -p release
          tar -czf release/openclaw-release.tar.gz \
            --exclude='node_modules/.cache' \
            --exclude='src' --exclude='test' --exclude='.git' \
            --exclude='*.tar.gz' --exclude='qa' --exclude='patches' \
            --exclude='security' --exclude='skills' --exclude='docs' \
            --exclude='apps' --exclude='extensions' --exclude='ui' \
            --exclude='config' --exclude='git-hooks' \
            --exclude='*.tsbuildinfo' --exclude='dist/**/*.map' \
            openclaw.mjs package.json pnpm-lock.yaml \
            pnpm-workspace.yaml dist/ node_modules/ \
            scripts/persona-import.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-release
          path: release/openclaw-release.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.sha }}
          tag_name: build-${{ github.run_number }}
          files: release/openclaw-release.tar.gz
          body: |
            ## ⚡ Auto-built from ${{ github.sha }}

            Pre-compiled deployment package. Extract and run — no `pnpm install` or `pnpm build` needed.

            ```bash
            tar -xzf openclaw-release.tar.gz -C /home/openclaw/.openclaw/
            sudo systemctl restart openclaw-gateway
            ```
