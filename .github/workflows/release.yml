name: Build Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create deploy package
        run: |
          mkdir deploy
          cp -r dist/ openclaw.mjs scripts/persona-import.mjs package.json patches/ deploy/

          cd deploy
          # Use npm to create flat node_modules (no symlinks — survives tar)
          npm install --omit=dev --ignore-scripts

          # Remove npm's package-lock (keep pnpm one)
          rm -f package-lock.json

          cd ..
          tar -czf openclaw-release.tar.gz -C deploy .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-release
          path: openclaw-release.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release build-${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          files: openclaw-release.tar.gz
          body: |
            ## ⚡ Pre-built release — extract and run

            No compilation needed. No `pnpm install`. Extract → start.

            ```bash
            tar -xzf openclaw-release.tar.gz -C /home/openclaw/.openclaw/
            sudo systemctl restart openclaw-gateway
            ```
