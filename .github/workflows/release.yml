name: Build Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create deploy package
        run: |
          # -h dereferences all symlinks in one go — no intermediate copy
          tar -czhf openclaw-release.tar.gz \
            dist/ openclaw.mjs scripts/ package.json pnpm-lock.yaml node_modules/

          echo "=== Verifying inside tar ==="
          tar -tzf openclaw-release.tar.gz | grep -E "(json5/index|better-sqlite3/lib/index)" | head -4
          echo "Package size: $(du -h openclaw-release.tar.gz | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-release
          path: openclaw-release.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release build-${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          files: openclaw-release.tar.gz
          body: |
            ## ⚡ Pre-built release — extract and run

            No compilation needed. No `pnpm install`. Extract → start.

            ```bash
            tar -xzf openclaw-release.tar.gz -C /home/openclaw/.openclaw/
            sudo systemctl restart openclaw-gateway
            ```
