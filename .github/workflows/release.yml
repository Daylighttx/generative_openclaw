name: Build Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create deploy package
        run: |
          # pnpm deploy creates a standalone dir with flat node_modules (no symlinks)
          pnpm deploy --prod deploy-dir

          # Add our custom entry files that aren't part of the workspace build
          cp openclaw.mjs deploy-dir/
          cp -r scripts/persona-import.mjs deploy-dir/

          tar -czf openclaw-release.tar.gz -C deploy-dir .

      - name: Verify package
        run: |
          tar -tzf openclaw-release.tar.gz | head -20
          SIZE=$(du -h openclaw-release.tar.gz | cut -f1)
          echo "Package size: $SIZE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-release
          path: openclaw-release.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release build-${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          files: openclaw-release.tar.gz
          body: |
            ## ⚡ Pre-built release — extract and run

            No compilation needed. No `pnpm install`. Extract → start.

            ```bash
            tar -xzf openclaw-release.tar.gz -C /home/openclaw/.openclaw/
            sudo systemctl restart openclaw-gateway
            ```
