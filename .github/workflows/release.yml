name: Build Release
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README_CN.md'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (flat layout, no symlinks)
        run: |
          echo "node-linker=hoisted" > .npmrc
          echo "shamefully-hoist=true" >> .npmrc
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create deploy package (flat node_modules, no symlinks needed)
        run: |
          tar -czf openclaw-release.tar.gz \
            dist/ openclaw.mjs scripts/ package.json pnpm-lock.yaml node_modules/

          echo "=== Verifying key deps ==="
          tar -tzf openclaw-release.tar.gz | grep "node_modules/json5/index" || echo "json5 MISSING"
          tar -tzf openclaw-release.tar.gz | grep "node_modules/better-sqlite3/lib/index" || echo "better-sqlite3 MISSING"
          echo "Package size: $(du -h openclaw-release.tar.gz | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-release
          path: openclaw-release.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release #${{ github.run_number }}
          files: openclaw-release.tar.gz
